<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4" />
  
  <!-- Outer Shield Ring -->
  <path d="M256 64 C350 64, 416 112, 416 192 C416 320, 256 432, 256 432 C256 432, 96 320, 96 192 C96 112, 162 64, 256 64 Z" 
        fill="url(#shieldGrad)" />
  
  <!-- Inner Cutout / Dark Shield Core -->
  <path d="M256 96 C330 96, 384 136, 384 200 C384 300, 256 394, 256 394 C256 394, 128 300, 128 200 C128 136, 182 96, 256 96 Z" 
        fill="#0f172a" />

  <!-- Navigation Arrow Pulse -->
  <polygon points="256,150 320,290 256,260 192,290" fill="#10b981" />
  <circle cx="256" cy="330" r="10" fill="#06b6d4" />
</svg>
